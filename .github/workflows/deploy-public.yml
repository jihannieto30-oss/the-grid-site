name: Deploy THE GRID

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout THE GRID
        uses: actions/checkout@v4
      - name: Upload THE GRID
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
      - name: Deploy THE GRID
        id: deployment
        uses: actions/deploy-pages@v4
